<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Dynamics Calculator - Coming Soon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f8fb;
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 {
      font-size: 4rem;
      color: #264653;
    }
    p {
      font-size: 1.5rem;
      color: #555;
    }
    .coming-soon {
      font-size: 2rem;
      margin: 1rem 0 2rem;
      color: #2a9d8f;
    }
    .upload-box {
      margin-top: 2rem;
      padding: 2rem;
      border: 2px dashed #2a9d8f;
      border-radius: 10px;
      background: #e0f7f1;
    }
    input[type="file"], input[type="number"] {
      margin: 1rem 0;
    }
    .btn {
      background: #2a9d8f;
      color: white;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #21867a;
    }
    .output {
      margin-top: 2rem;
      padding: 1rem;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: none;
    }
    .input-group {
      margin: 0.5rem 0;
    }
    label {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Football Metrics</h1>
    <p>AI-Based Inbound Velocity, Deformation & Contact Time Analysis</p>
    <div class="coming-soon">Coming Soon</div>

    <div class="upload-box">
      <h2>Upload Image Sequence</h2>
      <input type="file" id="imageInput" multiple accept="image/bmp,image/png,image/jpeg">
      <div class="input-group">
        <label for="mmPerPixel">mm per Pixel:</label>
        <input type="number" id="mmPerPixel" step="0.01" value="0.5" min="0">
      </div>
      <div class="input-group">
        <label for="fps">Frames per Second (FPS):</label>
        <input type="number" id="fps" step="1" value="30" min="1">
      </div>
      <br>
      <button class="btn" onclick="processImages()">Run Analysis</button>
    </div>

    <div class="output" id="outputBox">
      <h3>Estimated Results</h3>
      <p><strong>Inbound Velocity:</strong> <span id="vi"></span></p>
      <p><strong>Outbound Velocity:</strong> <span id="vo"></span></p>
      <p><strong>Coefficient of Restitution (COR):</strong> <span id="cor"></span></p>
      <p><strong>Contact Time:</strong> <span id="contactTime"></span></p>
      <p><strong>Deformation:</strong> <span id="deformation"></span></p>
    </div>
  </div>

  <script>
    async function processImages() {
      const output = document.getElementById('outputBox');
      output.style.display = 'block';

      // Reset the output fields to indicate loading
      document.getElementById('vi').textContent = 'Loading...';
      document.getElementById('vo').textContent = 'Loading...';
      document.getElementById('cor').textContent = 'Loading...';
      document.getElementById('contactTime').textContent = 'Loading...';
      document.getElementById('deformation').textContent = 'Loading...';

      const input = document.getElementById('imageInput');
      const files = input.files;
      if (!files.length) {
        alert("Please upload image frames first.");
        return;
      }

      // Limit the number of images to 30 to avoid server timeout
      const maxImages = 30;
      if (files.length > maxImages) {
        alert(`Please upload no more than ${maxImages} images to avoid server timeout.`);
        return;
      }
      console.log(`Uploading ${files.length} files:`, files);

      const mmPerPixel = document.getElementById('mmPerPixel').value;
      const fps = document.getElementById('fps').value;

      if (!mmPerPixel || mmPerPixel <= 0) {
        alert("Please enter a valid mm per pixel value.");
        return;
      }
      if (!fps || fps <= 0) {
        alert("Please enter a valid FPS value.");
        return;
      }

      const formData = new FormData();
      for (const file of files) {
        formData.append('images', file);
      }
      formData.append('mm_per_pixel', mmPerPixel);
      formData.append('fps', fps);

      try {
        console.log("Sending request to /analyze...");
        const response = await fetch('https://footballanalytics-4qmg.onrender.com/analyze', {
          method: 'POST',
          body: formData
        });
        console.log("Response status:", response.status);

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}: ${await response.text()}`);
        }

        const data = await response.json();
        console.log("API Response:", data);

        // Update DOM with results, even if they're zero
        document.getElementById('vi').textContent = `${(data.inbound_velocity || 0).toFixed(2)} m/s`;
        document.getElementById('vo').textContent = `${(data.outbound_velocity || 0).toFixed(2)} m/s`;
        document.getElementById('cor').textContent = `${(data.cor || 0).toFixed(2)}`;
        document.getElementById('contactTime').textContent = `${(data.contact_time || 0).toFixed(4)} s`;
        document.getElementById('deformation').textContent = `${(data.deformation || 0).toFixed(2)} mm`;
      } catch (error) {
        console.error('Error processing images:', error);
        alert(`Failed to process images: ${error.message}`);
        // Display error in the output
        document.getElementById('vi').textContent = 'Error';
        document.getElementById('vo').textContent = 'Error';
        document.getElementById('cor').textContent = 'Error';
        document.getElementById('contactTime').textContent = 'Error';
        document.getElementById('deformation').textContent = 'Error';
      }
    }
  </script>
</body>
</html>
